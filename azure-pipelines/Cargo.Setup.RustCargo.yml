# Resolves crates.io dependencies from the public darbotlm/rust_cargo vendored
# mirror (keyed by Cargo.lock hash). Replaces the `[source.crates-io]
# replace-with = "Mxc-Azure-Feed"` cargo config. Reuses the rust_cargo checkout
# from Rust.Toolchain.RustCargo.yml when that ran earlier in the job, else
# clones it. No secrets are needed.

parameters:
- name: lockFile
  type: string
  default: '$(Build.SourcesDirectory)/src/Cargo.lock'
- name: configFile
  type: string
  default: '$(Build.SourcesDirectory)/.cargo/config.toml'
- name: rustCargoRef
  type: string
  default: 'main'

steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $dir = $env:RUSTCARGODIR
      if (-not $dir -or -not (Test-Path "$dir/scripts/Use-RustCargoCrates.ps1")) {
        $dir = Join-Path '$(Agent.TempDirectory)' 'rust_cargo'
        Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue
        git clone --depth 1 --branch '${{ parameters.rustCargoRef }}' https://github.com/darbotlm/rust_cargo.git $dir
        if ($LASTEXITCODE) { throw 'clone of darbotlm/rust_cargo failed' }
        Write-Host "##vso[task.setvariable variable=RustCargoDir]$dir"
      }
      & "$dir/scripts/Use-RustCargoCrates.ps1" -LockFile '${{ parameters.lockFile }}' -ConfigFile '${{ parameters.configFile }}'
    displayName: Setup Cargo crate mirror (darbotlm/rust_cargo)
